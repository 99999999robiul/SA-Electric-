<!DOCTYPE html><html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>Book a Service | SA Electric</title>  <style>
    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body{
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(255,255,255,0.25), transparent 30%),
        linear-gradient(135deg, #6d8f48, #b6c98a);
      padding: 20px;
    }

    /* Navbar */
    nav{
      width: 100%;
      max-width: 700px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 18px;
      background: rgba(255,255,255,0.25);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 18px;
    }

    .logo{
      font-size: 20px;
      font-weight: bold;
    }

    .home{
      text-decoration: none;
      color: black;
      padding: 8px 15px;
      border-radius: 10px;
      background: rgba(255,255,255,0.4);
    }

    /* Main */
    .container{
      max-width: 700px;
      margin: 30px auto;
    }

    .header{
      text-align: center;
      margin-bottom: 25px;
    }

    .header h1{
      font-size: 28px;
      margin-bottom: 10px;
    }

    .header p{
      opacity: 0.8;
      line-height: 1.5;
    }

    /* Form Card */
    .card{
      background: rgba(255,255,255,0.35);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255,255,255,0.5);
      border-radius: 25px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }

    .form-group{
      margin-bottom: 18px;
    }

    label{
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input,
    select,
    textarea{
      width: 100%;
      padding: 14px;
      border: none;
      outline: none;
      border-radius: 12px;
      background: rgba(255,255,255,0.75);
      font-size: 15px;
    }

    textarea{
      height: 120px;
      resize: none;
    }

    /* Service options */
    .services{
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 10px;
    }

    .service-option{
      cursor: pointer;
    }

    .service-option input{
      display: none;
    }

    .service-box{
      display: block;
      padding: 15px 8px;
      text-align: center;
      background: rgba(255,255,255,0.35);
      border-radius: 12px;
      border: 2px solid transparent;
      transition: 0.3s;
      cursor: pointer;
    }

    .service-option input:checked + .service-box{
      border-color: #2d5a27;
      background: rgba(255,255,255,0.8);
      transform: scale(1.03);
    }

    /* Submit Button */
    button{
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 15px;
      background: #1f6b3b;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover{
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    }

    /* Quick Contact */
    .quick-contact{
      margin-top: 25px;
      text-align: center;
    }

    .quick-contact h3{
      margin-bottom: 15px;
    }

    .contact-buttons{
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .contact-buttons a{
      text-decoration: none;
      color: black;
      background: rgba(255,255,255,0.5);
      padding: 12px 18px;
      border-radius: 12px;
      transition: 0.3s;
    }

    .contact-buttons a:hover{
      transform: translateY(-3px);
    }

    /* Animation */
    .card{
      animation: show 0.8s ease;
    }

    @keyframes show{
      from{
        opacity: 0;
        transform: translateY(30px);
      }

      to{
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media(max-width: 450px){

      .services{
        grid-template-columns: 1fr 1fr;
      }

      .header h1{
        font-size: 24px;
      }

      .card{
        padding: 18px;
      }
    }

  </style></head><body>  <nav>
    <div class="logo">⚡ SA Electric</div>
    <a href="index.html" class="home">⌂ Home</a>
  </nav>  <div class="container"><div class="header">
  <h1>🔧 Book a Service</h1>
  <p>
    আপনার সমস্যার তথ্য দিন। আমাদের টেকনিশিয়ান
    দ্রুত আপনার সাথে যোগাযোগ করবে।
  </p>
</div>


<div class="card">

  <form id="serviceForm">

    <div class="form-group">
      <label>👤 আপনার নাম</label>
      <input
        type="text"
        id="name"
        placeholder="আপনার নাম লিখুন"
        required>
    </div>


    <div class="form-group">
      <label>📱 মোবাইল নাম্বার</label>
      <input
        type="tel"
        id="phone"
        placeholder="01XXXXXXXXX"
        required>
    </div>


    <div class="form-group">
      <label>📍 ঠিকানা</label>
      <input
        type="text"
        id="address"
        placeholder="আপনার এলাকার ঠিকানা লিখুন"
        required>
    </div>


    <div class="form-group">

      <label>🔧 কোন সার্ভিসটি প্রয়োজন?</label>

      <div class="services">

        <label class="service-option">
          <input type="radio" name="service" value="AC Repair" required>
          <span class="service-box">❄️ AC Repair</span>
        </label>

        <label class="service-option">
          <input type="radio" name="service" value="Fridge Repair">
          <span class="service-box">🧊 Fridge Repair</span>
        </label>

        <label class="service-option">
          <input type="radio" name="service" value="TV Repair">
          <span class="service-box">📺 TV Repair</span>
        </label>

        <label class="service-option">
          <input type="radio" name="service" value="Motor Repair">
          <span class="service-box">⚙️ Motor Repair</span>
        </label>

        <label class="service-option">
          <input type="radio" name="service" value="Home Wiring">
          <span class="service-box">🏠 Home Wiring</span>
        </label>

        <label class="service-option">
          <input type="radio" name="service" value="CCTV Installation">
          <span class="service-box">📹 CCTV</span>
        </label>

      </div>

    </div>


    <div class="form-group">
      <label>📝 সমস্যার বিস্তারিত</label>

      <textarea
        id="problem"
        placeholder="আপনার সমস্যাটি বিস্তারিত লিখুন..."
        required></textarea>
    </div>


    <button type="submit">
      🚀 Send Service Request
    </button>

  </form>


  <div class="quick-contact">

    <h3>অথবা সরাসরি যোগাযোগ করুন</h3>

    <div class="contact-buttons">

      <a href="tel:+8801576947654">
        📞 Call Now
      </a>

      <a href="https://wa.me/8801739677547">
        💬 WhatsApp
      </a>

      <a href="mailto:saelectrik999@gmail.com">
        ✉️ Email
      </a>

    </div>

  </div>

</div>

  </div>  <script>

    document.getElementById("serviceForm").addEventListener("submit", function(e){

      e.preventDefault();

      const name = document.getElementById("name").value;
      const phone = document.getElementById("phone").value;
      const address = document.getElementById("address").value;
      const problem = document.getElementById("problem").value;

      const service =
        document.querySelector('input[name="service"]:checked').value;


      const message =
`🔧 NEW SERVICE REQUEST

👤 নাম: ${name}

📱 মোবাইল: ${phone}

📍 ঠিকানা: ${address}

🛠️ সার্ভিস: ${service}

📝 সমস্যা:
${problem}

--------------------
SA Electric Website`;

      /* তোমার WhatsApp নাম্বার */
      const whatsappNumber = "8801739677547";

      const url =
        "https://wa.me/" +
        whatsappNumber +
        "?text=" +
        encodeURIComponent(message);

      window.open(url, "_blank");

    });
    
    

  </script></body>
</html>
